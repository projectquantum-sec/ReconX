# ReconX Main Configuration File
# This file is sourced by reconx.sh on startup

# ═══════════════════════════════════════════════════════════════
# Default Settings
# ═══════════════════════════════════════════════════════════════

# Default robustness level (1-5)
# 1 = Quick, 2 = Light, 3 = Normal, 4 = Thorough, 5 = Aggressive
DEFAULT_ROBUSTNESS_LEVEL=3

# Default scan mode: normal or bugbounty
DEFAULT_MODE="normal"

# Default export format: md, html, json, csv, pdf, all
DEFAULT_EXPORT_FORMAT="md"

# ═══════════════════════════════════════════════════════════════
# Logging Configuration
# ═══════════════════════════════════════════════════════════════

# Log level: DEBUG, INFO, WARN, ERROR
LOG_LEVEL="INFO"

# Log retention (days)
LOG_RETENTION_DAYS=30

# Enable colored output
COLORED_OUTPUT=true

# ═══════════════════════════════════════════════════════════════
# Scan Limits
# ═══════════════════════════════════════════════════════════════

# Maximum subdomains to process
MAX_SUBDOMAINS=1000

# Maximum URLs to scan for vulnerabilities
MAX_VULN_URLS=500

# Timeout for individual tools (seconds)
TOOL_TIMEOUT=300

# ═══════════════════════════════════════════════════════════════
# Bug Bounty Mode Settings
# ═══════════════════════════════════════════════════════════════

# Rate limit for bug bounty mode (requests per second)
BB_RATE_LIMIT=10

# Ports to scan in bug bounty mode
BB_PORTS="21,22,23,25,53,80,110,143,443,445,993,995,3306,3389,5432,8080,8443"

# Nmap timing for bug bounty mode
BB_NMAP_TIMING="T2"

# ═══════════════════════════════════════════════════════════════
# Output Settings
# ═══════════════════════════════════════════════════════════════

# Output directory (relative to BASE_DIR)
OUTPUT_DIR="output"

# Create timestamped output directories
TIMESTAMPED_OUTPUT=false

# Compress old output directories
COMPRESS_OLD_OUTPUT=false

# ═══════════════════════════════════════════════════════════════
# Notification Settings (optional)
# ═══════════════════════════════════════════════════════════════

# Slack webhook URL for notifications
SLACK_WEBHOOK=""

# Discord webhook URL for notifications
DISCORD_WEBHOOK=""

# Email notification settings
EMAIL_NOTIFY=false
EMAIL_TO=""
EMAIL_FROM=""
SMTP_SERVER=""

# ═══════════════════════════════════════════════════════════════
# Advanced Settings
# ═══════════════════════════════════════════════════════════════

# Enable parallel execution
PARALLEL_EXECUTION=true

# Maximum parallel jobs
MAX_PARALLEL_JOBS=10

# DNS resolver to use
DNS_RESOLVER="8.8.8.8"

# Custom wordlist paths
WORDLIST_COMMON="wordlists/common.txt"
WORDLIST_LARGE="wordlists/large.txt"
WORDLIST_DIRS="wordlists/directories.txt"
