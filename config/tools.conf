# ═══════════════════════════════════════════════════════════════
# Network, Proxy & OPSEC Settings
# ═══════════════════════════════════════════════════════════════

# HTTP / SOCKS5 Proxy (e.g., "http://127.0.0.1:8080" or "socks5://127.0.0.1:9050")
HTTP_PROXY=""
SOCKS5_PROXY=""

# Custom User-Agent Header (If empty, randomized UA will be used)
CUSTOM_USER_AGENT=""

# Custom Bug Bounty / Identification Headers (e.g., "X-Bug-Bounty: hackerone_user")
CUSTOM_HEADERS=""

# ═══════════════════════════════════════════════════════════════
# Nuclei Vulnerability Scanner Configuration
# ═══════════════════════════════════════════════════════════════

# Rate limit for requests
NUCLEI_RATE_LIMIT=300

# Size of bulk requests
NUCLEI_BULK_SIZE=50

# Concurrent requests
NUCLEI_CONCURRENCY=25

# Timeout in seconds
NUCLEI_TIMEOUT=10

# Max number of host errors
NUCLEI_MAX_HOST_ERROR=30

# Enable Interactsh
NUCLEI_INTERACTSH=true

# Exclude certain tags
NUCLEI_EXCLUDE_TAGS="dos,fuzz,intrusive"