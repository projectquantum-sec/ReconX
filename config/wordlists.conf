# ReconX Wordlists Configuration File
# Automatically detects and maps high-yield wordlists from /usr/share/wordlists and local repository

BASE_DIR="${BASE_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)}"

# ═══════════════════════════════════════════════════════════════
# 1. Subdomain Brute-Forcing Wordlists
# ═══════════════════════════════════════════════════════════════
# Fast / Top 5,000 subdomains
if [[ -f "$BASE_DIR/wordlists/subdomains-fast.txt" ]]; then
    WORDLIST_SUBS_COMMON="$BASE_DIR/wordlists/subdomains-fast.txt"
elif [[ -f "/usr/share/wordlists/seclists/Discovery/DNS/subdomains-top1million-5000.txt" ]]; then
    WORDLIST_SUBS_COMMON="/usr/share/wordlists/seclists/Discovery/DNS/subdomains-top1million-5000.txt"
else
    WORDLIST_SUBS_COMMON="$BASE_DIR/wordlists/common.txt"
fi

# Medium / Top 20,000 - 110,000 subdomains
if [[ -f "/usr/share/wordlists/seclists/Discovery/DNS/subdomains-top1million-110000.txt" ]]; then
    WORDLIST_SUBS_MEDIUM="/usr/share/wordlists/seclists/Discovery/DNS/subdomains-top1million-110000.txt"
elif [[ -f "/usr/share/wordlists/amass/bitquark_subdomains_top100K.txt" ]]; then
    WORDLIST_SUBS_MEDIUM="/usr/share/wordlists/amass/bitquark_subdomains_top100K.txt"
elif [[ -f "$BASE_DIR/wordlists/subdomains-medium.txt" ]]; then
    WORDLIST_SUBS_MEDIUM="$BASE_DIR/wordlists/subdomains-medium.txt"
else
    WORDLIST_SUBS_MEDIUM="$WORDLIST_SUBS_COMMON"
fi

# Large / Full DNS list
if [[ -f "/usr/share/wordlists/amass/all.txt" ]]; then
    WORDLIST_SUBS_LARGE="/usr/share/wordlists/amass/all.txt"
elif [[ -f "/usr/share/wordlists/seclists/Discovery/DNS/subdomains-top1million-110000.txt" ]]; then
    WORDLIST_SUBS_LARGE="/usr/share/wordlists/seclists/Discovery/DNS/subdomains-top1million-110000.txt"
else
    WORDLIST_SUBS_LARGE="$WORDLIST_SUBS_MEDIUM"
fi

# ═══════════════════════════════════════════════════════════════
# 2. Web Directory & File Fuzzing Wordlists
# ═══════════════════════════════════════════════════════════════
# Fast / Common (Level 1-3: ~4.6k words)
if [[ -f "$BASE_DIR/wordlists/directories-fast.txt" ]]; then
    WORDLIST_DIRS_COMMON="$BASE_DIR/wordlists/directories-fast.txt"
elif [[ -f "/usr/share/wordlists/dirb/common.txt" ]]; then
    WORDLIST_DIRS_COMMON="/usr/share/wordlists/dirb/common.txt"
elif [[ -f "/usr/share/wordlists/seclists/Discovery/Web-Content/common.txt" ]]; then
    WORDLIST_DIRS_COMMON="/usr/share/wordlists/seclists/Discovery/Web-Content/common.txt"
else
    WORDLIST_DIRS_COMMON="$BASE_DIR/wordlists/common.txt"
fi

# Medium / Thorough (Level 4: ~20k-30k words)
if [[ -f "/usr/share/wordlists/seclists/Discovery/Web-Content/raft-medium-directories.txt" ]]; then
    WORDLIST_DIRS_MEDIUM="/usr/share/wordlists/seclists/Discovery/Web-Content/raft-medium-directories.txt"
elif [[ -f "$BASE_DIR/wordlists/directories-medium.txt" ]]; then
    WORDLIST_DIRS_MEDIUM="$BASE_DIR/wordlists/directories-medium.txt"
elif [[ -f "/usr/share/wordlists/dirb/big.txt" ]]; then
    WORDLIST_DIRS_MEDIUM="/usr/share/wordlists/dirb/big.txt"
else
    WORDLIST_DIRS_MEDIUM="$WORDLIST_DIRS_COMMON"
fi

# Large / Exhaustive (Level 5: ~220k words)
if [[ -f "/usr/share/wordlists/dirbuster/directory-list-2.3-medium.txt" ]]; then
    WORDLIST_DIRS_LARGE="/usr/share/wordlists/dirbuster/directory-list-2.3-medium.txt"
elif [[ -f "/usr/share/wordlists/dirbuster/directory-list-2.3-small.txt" ]]; then
    WORDLIST_DIRS_LARGE="/usr/share/wordlists/dirbuster/directory-list-2.3-small.txt"
else
    WORDLIST_DIRS_LARGE="$WORDLIST_DIRS_MEDIUM"
fi

# Default active directory wordlist
WORDLIST_DIRS="$WORDLIST_DIRS_COMMON"

# ═══════════════════════════════════════════════════════════════
# 3. API, Parameter & Sensitive File Discovery Wordlists
# ═══════════════════════════════════════════════════════════════
if [[ -f "$BASE_DIR/wordlists/api-endpoints.txt" ]]; then
    WORDLIST_API="$BASE_DIR/wordlists/api-endpoints.txt"
elif [[ -f "/usr/share/wordlists/seclists/Discovery/Web-Content/api/api-endpoints.txt" ]]; then
    WORDLIST_API="/usr/share/wordlists/seclists/Discovery/Web-Content/api/api-endpoints.txt"
else
    WORDLIST_API="$WORDLIST_DIRS_COMMON"
fi

if [[ -f "$BASE_DIR/wordlists/parameters.txt" ]]; then
    WORDLIST_PARAMS="$BASE_DIR/wordlists/parameters.txt"
elif [[ -f "/usr/share/wordlists/seclists/Discovery/Web-Content/burp-parameter-names.txt" ]]; then
    WORDLIST_PARAMS="/usr/share/wordlists/seclists/Discovery/Web-Content/burp-parameter-names.txt"
else
    WORDLIST_PARAMS="$WORDLIST_DIRS_COMMON"
fi

if [[ -f "$BASE_DIR/wordlists/sensitive-files.txt" ]]; then
    WORDLIST_SENSITIVE="$BASE_DIR/wordlists/sensitive-files.txt"
elif [[ -f "/usr/share/wordlists/seclists/Discovery/Web-Content/quickhits.txt" ]]; then
    WORDLIST_SENSITIVE="/usr/share/wordlists/seclists/Discovery/Web-Content/quickhits.txt"
else
    WORDLIST_SENSITIVE="$WORDLIST_DIRS_COMMON"
fi

# ═══════════════════════════════════════════════════════════════
# 4. Fuzzing & Injection Payloads
# ═══════════════════════════════════════════════════════════════
WORDLIST_SQLI="/usr/share/wordlists/wfuzz/Injections/SQL.txt"
WORDLIST_XSS="/usr/share/wordlists/wfuzz/Injections/XSS.txt"
WORDLIST_TRAVERSAL="/usr/share/wordlists/wfuzz/Injections/Traversal.txt"
WORDLIST_PASSWORDS="/usr/share/wordlists/rockyou.txt"